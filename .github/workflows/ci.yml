name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all JavaScript
        run: |
          set -e
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done

      - name: Validate game data & integration
        run: node tools/validate.js
